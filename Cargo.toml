[workspace]
members = ["rstress", "rstress-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
humantime = "2"
reqwest = { version = "0.11", features = ["gzip", "json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] } 
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }